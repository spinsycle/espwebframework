; A framework app: this repo holds only the app, the framework comes in by tag.
; In your own repo replace the symlink line with the git URL (see docs/INSTALL.md):
;   https://github.com/spinsycle/espwebframework.git#v1.0.1
; and copy tools/build_ui.py from the framework next to this file as tools/build_ui.py.
[env]
extra_scripts = pre:../../tools/build_ui.py
lib_deps = symlink://../..
build_flags = -Wall

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/ESPAsyncTCP@2.0.0
    bblanchon/ArduinoJson@7.4.3
    paulstoffregen/OneWire@2.3.8
    marvinroger/AsyncMqttClient@0.9.0

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
    paulstoffregen/OneWire@2.3.8
    marvinroger/AsyncMqttClient@0.9.0

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
    paulstoffregen/OneWire@2.3.8
    marvinroger/AsyncMqttClient@0.9.0
