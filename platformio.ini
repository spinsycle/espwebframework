; Pinned platform versions: never let a dependency update silently break firmware.
[platformio]
src_dir = examples/smoke
default_envs = nodemcuv2, esp32dev

[env]
lib_deps = symlink://.
build_flags = -Wall -Wextra

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:native]
platform = native
test_framework = unity
build_flags = -Wall -Wextra -std=c++17 -Isrc
lib_deps =
