; Pinned platform versions: never let a dependency update silently break firmware.
[platformio]
src_dir = examples/smoke
default_envs = nodemcuv2, esp32dev

[env]
lib_deps =
    symlink://.
    esp32async/ESPAsyncWebServer@3.12.1
    bblanchon/ArduinoJson@7.4.3
    paulstoffregen/OneWire@2.3.8
build_flags = -Wall
extra_scripts = pre:tools/build_ui.py

[env:nodemcuv2]
platform = espressif8266@4.2.1
lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncTCP@2.0.0
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:esp32dev]
platform = espressif32@6.9.0
lib_deps =
    ${env.lib_deps}
    esp32async/AsyncTCP@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:native]
platform = native
; host-only logic tests: override the firmware libs and UI script inherited from [env]
extra_scripts =
lib_deps =
test_framework = unity
build_flags = -Wall -Wextra -std=c++17 -Isrc
